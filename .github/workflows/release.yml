name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Validate stable version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must be a stable version such as v1.2.3: $env:RELEASE_TAG"
          }

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up UCRT64 compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Test all packages
        shell: pwsh
        run: |
          $compilerRoot = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          .\test.ps1 -CCPath "$compilerRoot\gcc.exe" -CXXPath "$compilerRoot\g++.exe"

      - name: Build Windows bundle
        shell: pwsh
        run: |
          $compilerRoot = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          .\build.ps1 -Target all -Bundle -CCPath "$compilerRoot\gcc.exe" -CXXPath "$compilerRoot\g++.exe" -Version "${{ github.ref_name }}"

      - name: Package bundle and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\modbus-tcp-simulator-windows\*" -DestinationPath "dist\modbus-tcp-simulator-windows-amd64.zip" -Force
          $assets = @(
            "bin\modbus-tcp-simulator.exe",
            "bin\mockserver.exe",
            "dist\modbus-tcp-simulator-windows-amd64.zip"
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $asset)"
          }
          $checksums | Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" "bin\modbus-tcp-simulator.exe" "bin\mockserver.exe" "dist\modbus-tcp-simulator-windows-amd64.zip" "dist\SHA256SUMS.txt" --generate-notes --title "$env:RELEASE_TAG"
